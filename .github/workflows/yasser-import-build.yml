name: Import source and build Yasser Football APK
# Triggered build run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yasser-football-import-build
  cancel-in-progress: false

jobs:
  import-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Java and Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          test -x /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager || find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -1

      - name: Install Git LFS, NDK and CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs rsync
          git lfs install
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Import all source files without touching the source repository
        run: |
          git clone --depth 1 https://github.com/blurz17/blurz-native-football-.git /tmp/football-source
          cd /tmp/football-source
          git lfs pull || true
          cd "$GITHUB_WORKSPACE"
          rsync -a --exclude='.git' /tmp/football-source/ ./

      - name: Apply requested cinematic splash screen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("platform/android/app/src/main/java/org/libsdl/app/ui/SplashActivity.java")
          if not p.is_file():
              raise SystemExit(f"Expected splash file not found: {p}")
          code = r'''package org.libsdl.app.ui;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.view.animation.AccelerateDecelerateInterpolator;
          import android.view.animation.AlphaAnimation;
          import android.view.animation.Animation;
          import android.view.animation.AnimationSet;
          import android.view.animation.ScaleAnimation;
          import android.widget.FrameLayout;
          import android.widget.TextView;

          public class SplashActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  BlurzTheme.applyImmersive(this);

                  FrameLayout root = new FrameLayout(this);
                  GradientDrawable background = new GradientDrawable(
                      GradientDrawable.Orientation.TL_BR,
                      new int[] {
                          Color.parseColor("#240006"),
                          Color.parseColor("#B00018"),
                          Color.parseColor("#51000B")
                      }
                  );
                  root.setBackground(background);

                  TextView name = new TextView(this);
                  name.setText("Yasser Benmaghnia");
                  name.setTextColor(Color.WHITE);
                  name.setTextSize(32);
                  name.setTypeface(Typeface.create("sans-serif", Typeface.BOLD));
                  name.setLetterSpacing(0.045f);
                  name.setGravity(Gravity.CENTER);
                  name.setShadowLayer(24f, 0f, 0f, Color.parseColor("#CCFFFFFF"));
                  name.setPadding(24, 24, 24, 24);

                  FrameLayout.LayoutParams params = new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.WRAP_CONTENT,
                      Gravity.CENTER
                  );
                  root.addView(name, params);
                  setContentView(root);

                  AnimationSet cinematic = new AnimationSet(true);
                  cinematic.setInterpolator(new AccelerateDecelerateInterpolator());
                  AlphaAnimation fade = new AlphaAnimation(0f, 1f);
                  fade.setDuration(1700);
                  ScaleAnimation scale = new ScaleAnimation(
                      0.82f, 1.0f, 0.82f, 1.0f,
                      Animation.RELATIVE_TO_SELF, 0.5f,
                      Animation.RELATIVE_TO_SELF, 0.5f
                  );
                  scale.setDuration(1700);
                  cinematic.addAnimation(fade);
                  cinematic.addAnimation(scale);
                  name.startAnimation(cinematic);

                  new Handler(Looper.getMainLooper()).postDelayed(() -> {
                      startActivity(new Intent(SplashActivity.this, MainMenuActivity.class));
                      overridePendingTransition(android.R.anim.fade_in, android.R.anim.fade_out);
                      finish();
                  }, 3000);
              }
          }
          '''
          p.write_text(code, encoding="utf-8")
          PY

      - name: Commit imported project and splash update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import native football project and add Yasser cinematic splash"
            git push origin HEAD:main
          fi

      - name: Build Android release APK
        working-directory: platform/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yasser-Football-3D-APK
          path: platform/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
